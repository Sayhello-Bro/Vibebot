<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Vibebot Facebook 直播自動留言系統</title>
  <desc id="desc">Facebook 直播內容經過語音辨識與 LLM 分析後，自動產生留言。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.52" stop-color="#102e58"/>
      <stop offset="1" stop-color="#071d35"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193f70"/>
      <stop offset="1" stop-color="#0d264a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce1d4"/>
      <stop offset="1" stop-color="#6bbcff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9bd7ff" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12Z" fill="#63d8d1"/>
    </marker>
    <style>
      .tc { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #f4f9ff; }
      .muted { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #b8d1ec; }
      .eyebrow { font-family: Arial, sans-serif; fill: #72e0d5; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
      .card-title { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #f4f9ff; font-size: 32px; font-weight: 700; }
      .card-body { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #bed5ed; font-size: 21px; }
      .small { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #9db9d6; font-size: 18px; }
      .line { fill: none; stroke: #63d8d1; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="1630" cy="105" r="230" fill="#2c87c9" opacity=".08"/>
  <circle cx="1720" cy="1000" r="310" fill="#31c7b6" opacity=".055"/>

  <text x="960" y="105" text-anchor="middle" class="eyebrow">VIBEBOT · LIVE INTERACTION</text>
  <text x="960" y="178" text-anchor="middle" class="tc" font-size="62" font-weight="700">Facebook 直播自動留言系統</text>
  <text x="960" y="225" text-anchor="middle" class="muted" font-size="27">把直播主的聲音，轉換成即時、自然的觀眾互動</text>

  <path d="M346 560H1574" stroke="#63d8d1" stroke-opacity=".22" stroke-width="5" stroke-dasharray="10 18"/>

  <!-- Step 1 -->
  <g transform="translate(260 560)" filter="url(#shadow)">
    <rect x="-170" y="-205" width="340" height="410" rx="32" fill="url(#card)" stroke="#2b6fa7" stroke-width="2"/>
    <circle cy="-122" r="62" fill="#1877f2"/>
    <text y="-98" text-anchor="middle" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#fff">f</text>
    <text x="-133" y="-22" class="eyebrow" font-size="18">STEP 01</text>
    <text y="38" text-anchor="middle" class="card-title">Facebook 直播</text>
    <text y="81" text-anchor="middle" class="card-body">取得直播畫面與聲音</text>
    <path class="line" d="M-70 145h140v40H-70zM-42 145l13-17h28l13 17M-44 165l18-12 18 12 19-13 25 20"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(730 560)" filter="url(#shadow)">
    <rect x="-170" y="-205" width="340" height="410" rx="32" fill="url(#card)" stroke="#2b6fa7" stroke-width="2"/>
    <circle cy="-122" r="62" fill="#2ac9bd" opacity=".18"/>
    <rect x="-19" y="-161" width="38" height="72" rx="19" class="line"/>
    <path class="line" d="M-53-125a53 53 0 0 0 106 0M0-72v30M-26-42h52"/>
    <text x="-133" y="-22" class="eyebrow" font-size="18">STEP 02</text>
    <text y="38" text-anchor="middle" class="card-title">語音辨識</text>
    <text y="81" text-anchor="middle" class="card-body">將聲音轉成文字</text>
    <path class="line" d="M-74 165h13M-47 143v44M-20 155v22M7 132v55M34 149v38M61 139v48"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(1200 560)" filter="url(#shadow)">
    <rect x="-170" y="-205" width="340" height="410" rx="32" fill="url(#card)" stroke="#2b6fa7" stroke-width="2"/>
    <circle cy="-122" r="62" fill="#9d8bff" opacity=".22"/>
    <path d="M-34-134c-17-38 32-63 54-28 38-4 51 45 15 63 6 40-50 47-66 12-38 7-50-45-19-49z" fill="none" stroke="#b9adff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-19" cy="-119" r="7" fill="#b9adff"/><circle cx="5" cy="-138" r="7" fill="#b9adff"/><circle cx="28" cy="-114" r="7" fill="#b9adff"/>
    <path d="M-13-123l18-14M12-133l11 17" stroke="#b9adff" stroke-width="4"/>
    <text x="-133" y="-22" class="eyebrow" font-size="18">STEP 03</text>
    <text y="38" text-anchor="middle" class="card-title">LLM 分析</text>
    <text y="81" text-anchor="middle" class="card-body">理解內容與互動情境</text>
    <path class="line" d="M-74 180h148M-74 180v-34M-37 180v-59M0 180v-82M37 180v-49M-87 146l38-19 35 12 35-31 39 16"/>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1660 560)" filter="url(#shadow)">
    <rect x="-170" y="-205" width="340" height="410" rx="32" fill="url(#card)" stroke="#2b6fa7" stroke-width="2"/>
    <circle cy="-122" r="62" fill="#ffd166" opacity=".22"/>
    <path d="M-53-150h106v71h-66l-40 28v-28h-12z" class="line"/>
    <path d="M-26-122h52M-26-103h39" class="line"/>
    <text x="-133" y="-22" class="eyebrow" font-size="18">STEP 04</text>
    <text y="38" text-anchor="middle" class="card-title">自動留言</text>
    <text y="81" text-anchor="middle" class="card-body">即時回應直播內容</text>
    <circle cx="-43" cy="157" r="24" fill="none" stroke="#72e0d5" stroke-width="5"/><path d="M-54 157l8 8 16-19" stroke="#72e0d5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="line" d="M8 143h59v34H8zM20 143v-15h34v15"/>
  </g>

  <path d="M430 560H553" class="line" marker-end="url(#arrow)"/>
  <path d="M900 560H1023" class="line" marker-end="url(#arrow)"/>
  <path d="M1370 560H1483" class="line" marker-end="url(#arrow)"/>

</svg>
